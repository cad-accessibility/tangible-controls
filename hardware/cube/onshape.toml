# Where the cube's CAD comes from.
#
# The design lives in Onshape. Every file in this folder must be an export of
# one named Onshape version, never of the live workspace, so anyone can open
# the exact geometry that was printed. scripts/check_exports.py checks this in
# CI. The steps and the format of [version] and [[export]] are in
# docs/export-from-onshape.md.
#
# There is no [version] yet: the document has no named version, and exports
# from the shared link are turned off. Until both change, this folder holds
# no CAD files.

[document]
name = "cube final"
owner = "Felix Hähnlein"
id = "bacc1f6ed9ff69f796727760"
# The live design. It can change at any time, so link to it for viewing only.
workspace = "https://cad.onshape.com/documents/bacc1f6ed9ff69f796727760/w/9e219d2c0ee1db9e9269d6d5"

[[element]]
name = "cube_final"
id = "042012f0d09cb85f6243f4f7"
type = "PARTSTUDIO"

[[element]]
name = "witmotion"
id = "fae599f267904cb45f9cb451"
type = "PARTSTUDIO"
