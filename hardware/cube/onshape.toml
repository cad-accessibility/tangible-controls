# Where the cube's CAD comes from.
#
# The design lives in Onshape. Every file in this folder is an export of one
# named Onshape version, never of the live workspace, so anyone can open the
# exact geometry it came from. scripts/check_exports.py checks this in CI.
# The steps and the format of [version] and [[export]] are in
# docs/export-from-onshape.md.
#
# Print files (STL and 3MF) are not committed, because the meshes are large.
# They are attached to the GitHub release with the same name as the version.

[document]
name = "tangible-controls cube"
owner = "Carlos E. Tejada"
id = "3ceaf96421d57106502c1ab5"
# The live design. It can change at any time, so link to it for viewing only.
url = "https://cad.onshape.com/documents/3ceaf96421d57106502c1ab5"

# This document is a copy of Felix Hähnlein's original, made on 2026-10-05 so
# that a maintainer owns the source. The original is now private.
[document.copied_from]
name = "cube final"
owner = "Felix Hähnlein"
id = "bacc1f6ed9ff69f796727760"

[[element]]
name = "cube_final"
id = "ff1e1273a308ae3b6ae2383f"
type = "PARTSTUDIO"

[[element]]
name = "witmotion"
id = "ef433388e0cb14178a65c066"
type = "PARTSTUDIO"

[[element]]
name = "LICENSE"
id = "4100c97baa53e887fff9d492"
type = "BLOB"

[version]
name = "v0.1.0"
id = "72041857b1e6aaada89118c8"
created = 2026-10-05
url = "https://cad.onshape.com/documents/3ceaf96421d57106502c1ab5/v/72041857b1e6aaada89118c8"

[[export]]
file = "cube.x_t"
format = "Parasolid 38.1"
element = "cube_final"
parts = ["upper_cube", "lower_cube"]

[[export]]
file = "cube.step"
format = "STEP AP242, millimeters"
element = "cube_final"
parts = ["upper_cube", "lower_cube"]
