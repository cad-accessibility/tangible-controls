name: Accessibility barrier
description: Something in the guides, the parts or a device that blocks or slows you down when working without sight
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        These devices and guides are made for blind and low-vision people. There is no such thing as a minor accessibility barrier here.

  - type: textarea
    id: assistive_tech
    attributes:
      label: How were you working?
      description: The assistive technology and settings you used, or "by touch" for a physical part.
      placeholder: |
        Screen reader: NVDA, JAWS, VoiceOver, Orca
        Braille display:
        Other:
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true

  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: For example, a step that relies on sight, a part that is hard to tell apart by touch, a file you could not open, or an announcement that was missing or confusing.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where?
      description: The guide and step, the part, or the device.

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Workarounds you found, or anything else that would help.
